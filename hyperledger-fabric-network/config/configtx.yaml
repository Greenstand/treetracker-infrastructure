        - Host: orderer4.hlf-orderer.svc.cluster.local
          Port: 7050
          ClientTLSCert: consenters/orderer4-tls.pem
          ServerTLSCert: consenters/orderer4-tls.pem
        Options:
          TickInterval: 500ms
          ElectionTick: 10
          HeartbeatTick: 1
          MaxInflightBlocks: 5
          SnapshotIntervalSize: 16 MB
      Organizations:
      - Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: msp/orderer
        Policies:
          Readers:
            Type: Signature
            Rule: OR('OrdererMSP.member')
          Writers:
            Type: Signature
            Rule: OR('OrdererMSP.member')
