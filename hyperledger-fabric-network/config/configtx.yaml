Capabilities:
  Channel:
    V2_0: true
  Orderer:
    V2_0: true
  Application:
    V2_5: true
Profiles:
  TreetrackerChannel:
    Policies:
      Readers:
        Type: ImplicitMeta
        Rule: ANY Readers
      Writers:
        Type: ImplicitMeta
        Rule: ANY Writers
      Admins:
        Type: ImplicitMeta
        Rule: MAJORITY Admins
    Capabilities:
      V2_0: true
    Orderer:
      OrdererType: etcdraft
      Addresses:
      - orderer0.hlf-orderer.svc.cluster.local:7050
      - orderer1.hlf-orderer.svc.cluster.local:7050
      - orderer2.hlf-orderer.svc.cluster.local:7050
      - orderer3.hlf-orderer.svc.cluster.local:7050
      - orderer4.hlf-orderer.svc.cluster.local:7050
      BatchTimeout: 2s
      BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
      EtcdRaft:
        Consenters:
        - Host: orderer0.hlf-orderer.svc.cluster.local
          Port: 7050
          ClientTLSCert: consenters/orderer0-tls.pem
          ServerTLSCert: consenters/orderer0-tls.pem
        - Host: orderer1.hlf-orderer.svc.cluster.local
          Port: 7050
          ClientTLSCert: consenters/orderer1-tls.pem
