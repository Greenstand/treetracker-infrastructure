{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fabric-couchdb
  labels:
    {{- include "fabric-couchdb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      fabric.treetracker.io/component: couchdb
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hlf-ca, hlf-orderer, hlf-peer-org]
      ports:
        - protocol: TCP
          port: 5984
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hlf-ca, hlf-orderer, hlf-peer-org]
{{- end }}
