configMaps:
  couchdb-config:
    10-single-node.ini: |
      [couchdb]
      single_node = true

      [chttpd]
      require_valid_user = true

      [httpd]
      WWW-Authenticate = Basic realm="couchdb"
      enable_cors = false
networkPolicy:
  enabled: true
  clientNamespaceSelector:
    matchLabels:
      fabric.treetracker.io/client: 'true'
  adminNamespaceSelector:
