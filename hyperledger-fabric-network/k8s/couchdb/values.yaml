expectedNamespace: hlf-peer-org
commonLabels: {}
imagePullSecrets: []
nodeSelector: {}
tolerations: []
podAnnotations: {}
defaults:
  podAnnotations: {}
  pod:
    automountServiceAccountToken: false
    containers:
      couchdb:
        env:
          COUCHDB_USER:
            valueFrom:
              secretKeyRef:
                key: username
                name: couchdb-credentials
          COUCHDB_PASSWORD:
            valueFrom:
              secretKeyRef:
                key: password
                name: couchdb-credentials
        image: ghcr.io/hlf-enterprise-blockchain/couchdb@sha256:83a8bc6146f7a0a7dbe9e5dfeac0958b1178fcfdaa9f6d42a0c893eadd38b361
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: couchdb
          timeoutSeconds: 3
        ports:
        - containerPort: 5984
          name: couchdb
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: couchdb
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: couchdb
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /opt/couchdb/data
          name: couchdb-data
        - mountPath: /opt/couchdb/etc/local.d/10-single-node.ini
          name: couchdb-config
          readOnly: true
          subPath: 10-single-node.ini
    imagePullSecrets:
    - name: ghcr-pull
    securityContext:
      fsGroup: 5984
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 5984
      runAsNonRoot: true
      runAsUser: 5984
      seccompProfile:
        type: RuntimeDefault
    terminationGracePeriodSeconds: 30
    volumes:
      couchdb-config:
        configMap:
          defaultMode: 420
          items:
          - key: 10-single-node.ini
            path: 10-single-node.ini
          name: couchdb-config
nodes:
  peer0-cbo-couchdb:
    pod:
      volumes:
        couchdb-data:
          persistentVolumeClaim:
            claimName: couchdb-data-peer0-cbo-0
      serviceAccountName: peer0-cbo-couchdb
    enabled: true
    selectorLabels:
      app.kubernetes.io/instance: peer0-cbo-couchdb
      app.kubernetes.io/name: couchdb
    podLabels:
      app.kubernetes.io/component: state-database
      app.kubernetes.io/instance: peer0-cbo-couchdb
      app.kubernetes.io/name: couchdb
      fabric-peer: peer0-cbo
      organization: cbo
      app.kubernetes.io/part-of: hyperledger-fabric
