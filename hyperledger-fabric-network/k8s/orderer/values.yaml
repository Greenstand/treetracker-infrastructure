expectedNamespace: hlf-orderer
commonLabels: {}
imagePullSecrets: []
nodeSelector: {}
tolerations: []
podAnnotations: {}
defaults:
  podAnnotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '9443'
    prometheus.io/scrape: 'true'
  pod:
    containers:
      orderer:
        env:
          FABRIC_LOGGING_SPEC:
            value: info
          ORDERER_GENERAL_LISTENADDRESS:
            value: 0.0.0.0
          ORDERER_GENERAL_LISTENPORT:
            value: '7050'
          ORDERER_GENERAL_LOCALMSPID:
            value: OrdererMSP
          ORDERER_GENERAL_LOCALMSPDIR:
            value: /var/hyperledger/orderer/msp
          ORDERER_GENERAL_TLS_ENABLED:
            value: 'true'
          ORDERER_GENERAL_TLS_PRIVATEKEY:
            value: /var/hyperledger/orderer/tls/server.key
          ORDERER_GENERAL_TLS_CERTIFICATE:
            value: /var/hyperledger/orderer/tls/server.crt
          ORDERER_GENERAL_TLS_ROOTCAS:
            value: '[/var/hyperledger/orderer/tls/ca.crt]'
          ORDERER_OPERATIONS_LISTENADDRESS:
            value: 0.0.0.0:9443
          ORDERER_OPERATIONS_TLS_ENABLED:
            value: 'false'
          ORDERER_METRICS_PROVIDER:
            value: prometheus
          ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY:
            value: /var/hyperledger/orderer/tls/server.key
          ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE:
            value: /var/hyperledger/orderer/tls/server.crt
          ORDERER_GENERAL_CLUSTER_ROOTCAS:
            value: '[/var/hyperledger/orderer/tls/ca.crt]'
          FABRIC_CFG_PATH:
            value: /var/hyperledger/orderer
          ORDERER_FILELEDGER_LOCATION:
            value: /var/hyperledger/production/orderer
          ORDERER_ADMIN_LISTENADDRESS:
            value: 0.0.0.0:9444
          ORDERER_ADMIN_TLS_ENABLED:
            value: 'true'
          ORDERER_CHANNELPARTICIPATION_ENABLED:
            value: 'true'
          ORDERER_GENERAL_BOOTSTRAPMETHOD:
            value: none
          ORDERER_CHANNELPARTICIPATION_MAXREQUESTBODYSIZE:
            value: '104857600'
          ORDERER_ADMIN_TLS_PRIVATEKEY:
            value: /var/hyperledger/orderer/tls/server.key
          ORDERER_ADMIN_TLS_CERTIFICATE:
            value: /var/hyperledger/orderer/tls/server.crt
          ORDERER_ADMIN_TLS_CLIENTROOTCAS:
            value: '[/var/hyperledger/orderer/admin-client-ca/ca.crt]'
        image: registry.digitalocean.com/treetracker-registry/treetracker-web@sha256:711fc6fe07b6aec3026a38c22ad87c6e77f4edfad1b120e294c687af27916b57
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9443
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - containerPort: 7050
          name: orderer
          protocol: TCP
        - containerPort: 9443
          name: operations
          protocol: TCP
        - containerPort: 9444
          name: admin
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9443
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/hyperledger/orderer/msp/signcerts/cert.pem
          name: msp-signcerts
          readOnly: true
          subPath: signcerts.cert.pem
        - mountPath: /var/hyperledger/orderer/msp/cacerts/ca-cert.pem
          name: msp-cacerts
          readOnly: true
          subPath: cacerts.cert.pem
        - mountPath: /var/hyperledger/orderer/msp/admincerts/admin-cert.pem
          name: msp-admincerts
          readOnly: true
          subPath: admincerts.cert.pem
        - mountPath: /var/hyperledger/orderer/msp/keystore/key.pem
          name: msp-keystore
          readOnly: true
          subPath: keystore.key
        - mountPath: /var/hyperledger/orderer/tls
          name: tls
          readOnly: true
        - mountPath: /var/hyperledger/production/orderer
          name: data
        - mountPath: /var/hyperledger/orderer/orderer.yaml
          name: config
          readOnly: true
          subPath: orderer.yaml
        - name: admin-client-ca
          mountPath: /var/hyperledger/orderer/admin-client-ca
          readOnly: true
        workingDir: /var/hyperledger/production/orderer
    imagePullSecrets:
    - name: registry-treetracker-registry
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: Always
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    terminationGracePeriodSeconds: 90
    volumes:
      msp-signcerts:
        secret:
          defaultMode: 420
          items:
          - key: signcerts.cert.pem
            path: signcerts.cert.pem
      msp-cacerts:
        secret:
          defaultMode: 420
          items:
          - key: cacerts.cert.pem
            path: cacerts.cert.pem
      msp-admincerts:
        secret:
          defaultMode: 420
          items:
          - key: admincerts.cert.pem
            path: admincerts.cert.pem
      msp-keystore:
        secret:
          defaultMode: 420
          items:
          - key: keystore.key
            path: keystore.key
      tls:
        secret:
          defaultMode: 420
          items:
          - key: server.crt
            path: server.crt
          - key: server.key
            path: server.key
          - key: ca.crt
            path: ca.crt
      config:
        configMap:
          defaultMode: 420
      admin-client-ca:
        secret:
          secretName: orderer-admin-client-ca
          items:
          - key: ca.crt
            path: ca.crt
    automountServiceAccountToken: false
