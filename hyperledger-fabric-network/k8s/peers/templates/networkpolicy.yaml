{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fabric-peers
  labels:
    {{- include "fabric-peers.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      fabric.treetracker.io/component: peers
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hlf-ca, hlf-orderer, hlf-peer-org]
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.clientNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 7051
        - protocol: TCP
          port: 7052
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hlf-ca, hlf-orderer, hlf-peer-org]
{{- end }}
