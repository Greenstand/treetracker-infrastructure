          OrganizationalUnitIdentifier: orderer
  fabric-external-builder:
    detect: |
      #!/bin/sh
      set -eu
      test -f "$2/metadata.json"
      grep -Eq '"type"[[:space:]]*:[[:space:]]*"external"' "$2/metadata.json"
    build: |
      #!/bin/sh
      set -eu
      test -s "$1/connection.json"
      cp "$1/connection.json" "$3/connection.json"
      if [ -d "$1/metadata" ]; then cp -R "$1/metadata" "$3/metadata"; fi
    release: |
      #!/bin/sh
      set -eu
      test -s "$1/connection.json"
      mkdir -p "$2/chaincode/server"
      cp "$1/connection.json" "$2/chaincode/server/connection.json"
      if [ -d "$1/metadata" ]; then cp -R "$1/metadata/." "$2/"; fi
