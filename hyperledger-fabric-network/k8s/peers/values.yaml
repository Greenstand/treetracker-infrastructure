expectedNamespace: hlf-peer-org
commonLabels: {}
imagePullSecrets: []
nodeSelector: {}
tolerations: []
podAnnotations: {}
defaults:
  podAnnotations: {}
  pod:
    containers:
      peer:
        env:
          CORE_PEER_CHAINCODELISTENADDRESS:
            value: 0.0.0.0:7052
          CORE_PEER_MSPCONFIGPATH:
            value: /var/hyperledger/msp
          CORE_PEER_LISTENADDRESS:
            value: 0.0.0.0:7051
          CORE_PEER_GOSSIP_USELEADERELECTION:
            value: 'true'
          CORE_PEER_GOSSIP_ORGLEADER:
            value: 'false'
          CORE_PEER_PROFILE_ENABLED:
            value: 'true'
          CORE_PEER_TLS_ENABLED:
            value: 'true'
          CORE_PEER_TLS_CERT_FILE:
            value: /var/hyperledger/tls/server.crt
          CORE_PEER_TLS_KEY_FILE:
            value: /var/hyperledger/tls/server.key
          CORE_PEER_TLS_ROOTCERT_FILE:
            value: /var/hyperledger/tls/ca.crt
          CORE_LEDGER_STATE_STATEDATABASE:
            value: CouchDB
          CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME:
            valueFrom:
              secretKeyRef:
                key: username
                name: couchdb-credentials
          CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD:
            valueFrom:
              secretKeyRef:
                key: password
                name: couchdb-credentials
          FABRIC_LOGGING_SPEC:
            value: info
          CORE_PEER_LOGGING_LEVEL:
            value: info
          CORE_OPERATIONS_LISTENADDRESS:
            value: 0.0.0.0:9443
          CORE_OPERATIONS_TLS_ENABLED:
            value: 'false'
          CORE_METRICS_PROVIDER:
            value: prometheus
          CORE_CHAINCODE_EXECUTETIMEOUT:
            value: 300s
          CORE_CHAINCODE_STARTUPTIMEOUT:
            value: 300s
          CORE_CHAINCODE_LOGGING_LEVEL:
            value: info
          CORE_CHAINCODE_LOGGING_SHIM:
            value: info
          CORE_CHAINCODE_EXTERNALBUILDERS:
            value: '[{"name": "external", "path": "/builders/external", "environmentWhitelist": ["GOPROXY"]}]'
        image: docker.io/hyperledger/fabric-peer@sha256:09ee75042de9983bfde31ca88a5bf033386351f10a990e4c48264ee50172dee0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9443
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: 7051
          name: peer-port
          protocol: TCP
        - containerPort: 7052
          name: chaincode-port
          protocol: TCP
        - containerPort: 9443
          name: operations-port
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9443
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: 9443
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: Always
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    terminationGracePeriodSeconds: 90
    volumes:
      msp-certs:
        secret:
          defaultMode: 420
          items:
          - key: msp-cert
            path: msp-cert
          - key: msp-key
            path: msp-key
          - key: msp-cacert
            path: msp-cacert
      tls-certs:
        secret:
          defaultMode: 420
          items:
          - key: tls-cert
            path: tls-cert
          - key: tls-key
            path: tls-key
          - key: tls-cacert
            path: tls-cacert
      msp-config:
        configMap:
          defaultMode: 420
      builders:
        configMap:
          name: fabric-external-builder
          defaultMode: 365
          items:
          - key: detect
            path: external/bin/detect
          - key: build
            path: external/bin/build
          - key: release
            path: external/bin/release
    automountServiceAccountToken: false
nodes:
  peer0-cbo:
