apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "treetracker-pgpool"
  namespace: "pgpool"
  labels:
    app: "treetracker-pgpool"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "treetracker-pgpool"
  template:
    metadata:
      labels:
        app: "treetracker-pgpool"
    spec:
      containers:
      - name: "treetracker-pgpool"
        image: pgpool/pgpool:4.2.2
        # Startup only: the pod gets traffic once pgpool listens. No readiness probe,
        # so a busy pgpool is not taken out of the Service.
        startupProbe:
          tcpSocket:
            port: 9999
          periodSeconds: 2
          failureThreshold: 30
        env:
        volumeMounts:
        - name: pgpool-config
          mountPath: /config
        - name: oiddir
          mountPath: /var/log/pgpool
      volumes:
      - name: pgpool-config
        configMap:
          name: pgpool-config
      - name: oiddir
        emptyDir: {}
