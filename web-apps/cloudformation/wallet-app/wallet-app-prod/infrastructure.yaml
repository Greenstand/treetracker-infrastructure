# Update the stack with a change set and check Replacement=False on the distribution before executing.
AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 origin + CloudFront (OAC) with named origin, aliases, ACM cert and .html path rewrite

Parameters:
  BucketName:
    Type: String
    Default: ''
    Description: Optional. Leave blank to let CloudFormation generate a name.

  OriginId:
    Type: String
    Default: S3OriginMain
    Description: Friendly name for the CloudFront Origin (Origin Id).

  DomainName:
    Type: String
    Description: Alternate domain name (CNAME) served by the distribution.

  AcmCertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 covering DomainName.

  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: Lowest cost is PriceClass_100.

Conditions:
  HasBucketName: !Not
    - !Equals
      - !Ref BucketName
      - ''

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - HasBucketName
        - !Ref BucketName
        - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: OAC for private S3 origin

  PathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-path-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Append .html to extension-less paths (Next.js static export on an S3 REST origin)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        // CloudFront Function (viewer-request) for the Greenstand wallet web app.
        //
        // The app is a Next.js `output: "export"` build with flat .html files (claim.html,
        // auth/callback.html, ...). The origin is an S3 REST endpoint, which does no index-document
        // resolution and no ".html" appending. This function does that job, so that
        //   /                    -> /index.html
        //   /claim               -> /claim.html            (query string is untouched, lives in request.querystring)
        //   /auth/callback       -> /auth/callback.html
        //   /_next/static/x.js   -> unchanged (has a file extension)
        function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // "/" and any directory-style path -> index.html
            if (uri.endsWith('/')) {
                request.uri = uri + 'index.html';
                return request;
            }

            // Anything whose last segment has a dot is a real file: pass through untouched.
            var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
            if (lastSegment.indexOf('.') !== -1) {
                return request;
            }

            // Extension-less route -> the flat file the export produced
            request.uri = uri + '.html';
            return request;
        }

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub S3 origin for ${AWS::StackName}
        DefaultRootObject: index.html
        PriceClass: !Ref PriceClass

        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        # The S3 REST origin answers 403 for a missing key; show the app's 404 page instead of raw XML.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10

        Origins:
          - Id: !Ref OriginId
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}

        DefaultCacheBehavior:
          TargetOriginId: !Ref OriginId
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PathRewriteFunction.FunctionMetadata.FunctionARN

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

Outputs:
  BucketName:
    Value: !Ref SiteBucket

  OriginId:
    Value: !Ref OriginId

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName

  DistributionId:
    Value: !Ref CloudFrontDistribution
